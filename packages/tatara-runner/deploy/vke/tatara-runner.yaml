# Tatara T2 runners on VKE (AWAI-3542, hardened in AWAI-3799). No Nix, no image registry.
# - One StatefulSet (replicas 0 or 1) per runner identity: tatara-runner-N mounts only Secret
#   tatara-runner-identity-N. A compromised pod holds one DID, never a quorum.
# - Pods run in their own user namespace (hostUsers: false): root in the pod is an unprivileged uid on
#   the node. Capabilities are dropped except CHOWN/DAC_OVERRIDE/FOWNER (apt at boot, chown of the job
#   directory) and SETUID/SETGID (to drop to the step user), all scoped to the pod's user namespace. No
#   SYS_ADMIN or NET_ADMIN: a :none step unshares its own user + network namespace as the step user. Steps run as uid
#   20000 with no capabilities and no_new_privs, and cannot read the identity (0600, root).
# - No tailscale, no NET_ADMIN, no /dev/net/tun, no DNS, no service account token. The pod can reach
#   only the coordinator (10.96.79.90:8790) and the egress proxy (10.96.79.128:3128); see
#   network-policy.yaml. Downloads at boot and :fetch steps go through the proxy's allowlist.
# - Only on the runner pool (label tatara.network/role=runner, taint tatara.network/runner=ci), one runner
#   per node. The pool is vc2-1c-2gb, min 1 (VKE pools cannot scale up from 0), max 3; 800m CPU allocatable,
#   350m taken by DaemonSets and often 250m by calico-typha, so a runner requests 150m (burst to 1 CPU).
# - The scaler (scaler.yaml) sets each StatefulSet to 0 or 1.
apiVersion: v1
kind: ConfigMap
metadata: {name: tatara-runner-boot, namespace: tatara}
data:
  boot.sh: |
    #!/bin/sh
    set -eu
    ORD=${POD_NAME%-0}; ORD=${ORD##*-}
    export DEBIAN_FRONTEND=noninteractive http_proxy="$PROXY" https_proxy="$PROXY"
    apt-get -o Acquire::http::Proxy="$PROXY" update -q >/dev/null
    apt-get -o Acquire::http::Proxy="$PROXY" install -y -q git curl xz-utils ca-certificates util-linux iproute2 openssl >/dev/null
    T=$(mktemp -d); cd "$T"
    check256() { echo "$2  $1" | sha256sum -c - >/dev/null || { echo "digest mismatch: $1" >&2; exit 3; }; }
    check512() { [ "$(openssl dgst -sha512 -binary "$1" | base64 -w0)" = "$2" ] || { echo "digest mismatch: $1" >&2; exit 3; }; }
    curl -fsSLo node.tar.xz https://nodejs.org/dist/v22.23.5/node-v22.23.5-linux-x64.tar.xz
    check256 node.tar.xz cdeb8670a0c81f51b4dc4ac61919f9b1ad917b304bf8221eb939570663d240f8
    mkdir -p /opt/node && tar -xJf node.tar.xz --strip-components=1 -C /opt/node
    curl -fsSLo bb.tgz https://github.com/babashka/babashka/releases/download/v1.12.218/babashka-1.12.218-linux-amd64-static.tar.gz
    check256 bb.tgz 7bd028cc794732ffde3da31ce4379840893c8e54f1046f92a8dfc4f4b3cddaf8
    tar -xzf bb.tgz -C /usr/local/bin bb
    curl -fsSLo nbb.tgz https://registry.npmjs.org/nbb/-/nbb-1.4.208.tgz
    check512 nbb.tgz SvkQfK+wKKy10F7c4llVX/+ys0sKEHeFwLPIA3UFrD3LBjLKbkUv7huQcHviZ1rEZ/qffTHp9u2OioyekqVgOA==
    curl -fsSLo resolve.tgz https://registry.npmjs.org/import-meta-resolve/-/import-meta-resolve-4.2.0.tgz
    check512 resolve.tgz Iqv2fzaTQN28s/FwZAoFq0ZSs/7hMAHJVX+w8PZl3cY19Pxk6jFFalxQoIfW2826i/fDLXv8IiEZRIT0lDuWcg==
    mkdir -p /opt/nbb/node_modules/import-meta-resolve
    tar -xzf nbb.tgz --strip-components=1 -C /opt/nbb; tar -xzf resolve.tgz --strip-components=1 -C /opt/nbb/node_modules/import-meta-resolve
    printf '#!/bin/sh\nexec /opt/node/bin/node /opt/nbb/cli.js "$@"\n' > /usr/local/bin/nbb; chmod 755 /usr/local/bin/nbb
    ln -sfn /opt/node/bin/node /usr/local/bin/node; ln -sfn /opt/node/bin/npm /usr/local/bin/npm
    git clone -q https://github.com/network-awai/app-tatara.git /opt/tatara && git -C /opt/tatara checkout -q --detach "$TATARA_REV"
    unset http_proxy https_proxy
    # The identity stays root-only; steps run as uid 20000 and cannot read it.
    install -d -m 711 /var/lib/tatara /var/lib/tatara/work
    install -m 600 /identity/identity.edn /var/lib/tatara/identity.edn
    cat > /var/lib/tatara/runner.edn <<EOF
    {:coordinator "$COORDINATOR"
     :identity "/var/lib/tatara/identity.edn"
     :work "/var/lib/tatara/work"
     :tiers [:t2]
     :poll-ms 10000
     :network-enforcement :unshare
     :step-user {:uid 20000 :gid 20000}
     :fetch {:proxy "$PROXY"}}
    EOF
    echo "runner $POD_NAME ($ORD) $(grep -oE ':did "[^"]+"' /var/lib/tatara/identity.edn); node $(node --version); $(bb --version); tatara $(git -C /opt/tatara rev-parse --short HEAD); uid_map $(cat /proc/self/uid_map | tr -s ' ')"
    until curl -s -m 5 -o /dev/null "$COORDINATOR/"; do echo "waiting for coordinator"; sleep 5; done
    cd /opt/tatara/packages/tatara-runner && exec bb run /var/lib/tatara/runner.edn
---
# One StatefulSet per identity (N = 0, 1, 2); they differ only in the name, label and Secret.
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: tatara-runner-0, namespace: tatara, labels: {app: tatara-runner}}
spec:
  serviceName: tatara-runner
  replicas: 0
  selector: {matchLabels: {app: tatara-runner, tatara.network/identity: "0"}}
  template:
    metadata: {labels: {app: tatara-runner, tatara.network/identity: "0"}}
    spec:
      hostUsers: false
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      # No cluster DNS: the pod talks to fixed ClusterIPs only; the proxy resolves names.
      dnsPolicy: None
      dnsConfig: {nameservers: ["127.0.0.1"]}
      nodeSelector: {tatara.network/role: runner}
      tolerations: [{key: tatara.network/runner, operator: Equal, value: ci, effect: NoSchedule}]
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: tatara-runner}}
              topologyKey: kubernetes.io/hostname
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: runner
          image: ubuntu:24.04
          command: ["/bin/sh", "/boot/boot.sh"]
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: TATARA_REV, value: "TATARA_REV_PLACEHOLDER"}
            - {name: COORDINATOR, value: "http://10.96.79.90:8790"}
            - {name: PROXY, value: "http://10.96.79.128:3128"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]}
          volumeMounts:
            - {name: boot, mountPath: /boot}
            - {name: identity, mountPath: /identity, readOnly: true}
          resources: {requests: {cpu: 150m, memory: 1Gi}, limits: {cpu: "1", memory: 1536Mi}}
      volumes:
        - {name: boot, configMap: {name: tatara-runner-boot}}
        - {name: identity, secret: {secretName: tatara-runner-identity-0, defaultMode: 0400}}
---

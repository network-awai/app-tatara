# Tatara T2 runners on VKE (AWAI-3542). No Nix, no image registry.
# - StatefulSet tatara-runner: pod N uses identity Secret tatara-runner-identity-N (N = 0..2), so every
#   replica has its own DID; all three DIDs are in the coordinator :allow set.
# - Sidecar tailscale joins the tailnet (ephemeral, auth key Secret tailscale-auth) so the runner reaches
#   the coordinator at 100.108.223.94:8790.
# - Container runner installs pinned Node 22.23.5, Babashka 1.12.218, nbb 1.4.208 (digests checked) and
#   app-tatara at a fixed commit, then runs `bb run runner.edn`. iproute2 is needed: :unshare steps
#   bring up loopback with `ip link set lo up` (without it every :network :none step fails).
# - The replica count is set by the queue-based scaler (scaler.yaml); it starts at 0.
apiVersion: v1
kind: ConfigMap
metadata: {name: tatara-runner-boot, namespace: tatara}
data:
  boot.sh: |
    #!/bin/sh
    set -eu
    ORD=${POD_NAME##*-}
    export DEBIAN_FRONTEND=noninteractive
    apt-get update -q >/dev/null && apt-get install -y -q git curl xz-utils ca-certificates util-linux iproute2 openssl python3 >/dev/null
    T=$(mktemp -d); cd "$T"
    check256() { echo "$2  $1" | sha256sum -c - >/dev/null || { echo "digest mismatch: $1" >&2; exit 3; }; }
    check512() { [ "$(openssl dgst -sha512 -binary "$1" | base64 -w0)" = "$2" ] || { echo "digest mismatch: $1" >&2; exit 3; }; }
    curl -fsSLo node.tar.xz https://nodejs.org/dist/v22.23.5/node-v22.23.5-linux-x64.tar.xz
    check256 node.tar.xz cdeb8670a0c81f51b4dc4ac61919f9b1ad917b304bf8221eb939570663d240f8
    mkdir -p /opt/node && tar -xJf node.tar.xz --strip-components=1 -C /opt/node
    curl -fsSLo bb.tgz https://github.com/babashka/babashka/releases/download/v1.12.218/babashka-1.12.218-linux-amd64-static.tar.gz
    check256 bb.tgz 7bd028cc794732ffde3da31ce4379840893c8e54f1046f92a8dfc4f4b3cddaf8
    tar -xzf bb.tgz -C /usr/local/bin bb
    curl -fsSLo nbb.tgz https://registry.npmjs.org/nbb/-/nbb-1.4.208.tgz
    check512 nbb.tgz SvkQfK+wKKy10F7c4llVX/+ys0sKEHeFwLPIA3UFrD3LBjLKbkUv7huQcHviZ1rEZ/qffTHp9u2OioyekqVgOA==
    curl -fsSLo resolve.tgz https://registry.npmjs.org/import-meta-resolve/-/import-meta-resolve-4.2.0.tgz
    check512 resolve.tgz Iqv2fzaTQN28s/FwZAoFq0ZSs/7hMAHJVX+w8PZl3cY19Pxk6jFFalxQoIfW2826i/fDLXv8IiEZRIT0lDuWcg==
    mkdir -p /opt/nbb/node_modules/import-meta-resolve
    tar -xzf nbb.tgz --strip-components=1 -C /opt/nbb; tar -xzf resolve.tgz --strip-components=1 -C /opt/nbb/node_modules/import-meta-resolve
    printf '#!/bin/sh\nexec /opt/node/bin/node /opt/nbb/cli.js "$@"\n' > /usr/local/bin/nbb; chmod 755 /usr/local/bin/nbb
    ln -sfn /opt/node/bin/node /usr/local/bin/node; ln -sfn /opt/node/bin/npm /usr/local/bin/npm
    git clone -q https://github.com/network-awai/app-tatara.git /opt/tatara && git -C /opt/tatara checkout -q --detach "$TATARA_REV"
    mkdir -p /var/lib/tatara/work; install -m 600 /identities/identity-$ORD/identity.edn /var/lib/tatara/identity.edn
    cat > /var/lib/tatara/runner.edn <<EOF
    {:coordinator "$COORDINATOR"
     :identity "/var/lib/tatara/identity.edn"
     :work "/var/lib/tatara/work"
     :tiers [:t2]
     :poll-ms 10000
     :network-enforcement $NETWORK_ENFORCEMENT}
    EOF
    echo "runner $POD_NAME ($ORD) $(grep -oE ':did "[^"]+"' /var/lib/tatara/identity.edn); node $(node --version); $(bb --version); tatara $(git -C /opt/tatara rev-parse --short HEAD)"
    until curl -s -m 5 -o /dev/null "$COORDINATOR/"; do echo "waiting for tailnet route to coordinator"; sleep 5; done
    cd /opt/tatara/packages/tatara-runner && exec bb run /var/lib/tatara/runner.edn
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: tatara-runner, namespace: tatara}
spec:
  serviceName: tatara-runner
  replicas: 0
  podManagementPolicy: Parallel
  selector: {matchLabels: {app: tatara-runner}}
  template:
    metadata: {labels: {app: tatara-runner}}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: tailscale
          image: tailscale/tailscale:v1.104.7
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: TS_HOSTNAME, value: "vke-$(POD_NAME)"}
            - {name: TS_AUTHKEY, valueFrom: {secretKeyRef: {name: tailscale-auth, key: TS_AUTHKEY}}}
            - {name: TS_KUBE_SECRET, value: ""}
            - {name: TS_USERSPACE, value: "false"}
            - {name: TS_STATE_DIR, value: /var/lib/tailscale}
            - {name: TS_EXTRA_ARGS, value: "--accept-dns=false"}
          securityContext: {capabilities: {add: [NET_ADMIN, NET_RAW]}}
          volumeMounts:
            - {name: dev-tun, mountPath: /dev/net/tun}
            - {name: ts-state, mountPath: /var/lib/tailscale}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
        - name: runner
          image: ubuntu:24.04
          command: ["/bin/sh", "/boot/boot.sh"]
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: TATARA_REV, value: "6c3b3aac61023e87fbe93797c4304621169651a5"}
            - {name: COORDINATOR, value: "http://100.108.223.94:8790"}
            - {name: NETWORK_ENFORCEMENT, value: ":unshare"}
          securityContext: {capabilities: {add: [SYS_ADMIN]}}
          volumeMounts:
            - {name: boot, mountPath: /boot}
            - {name: identities, mountPath: /identities, readOnly: true}
          resources: {requests: {cpu: "1500m", memory: 3Gi}, limits: {cpu: "3500m", memory: 6Gi}}
      volumes:
        - {name: boot, configMap: {name: tatara-runner-boot}}
        - {name: dev-tun, hostPath: {path: /dev/net/tun, type: CharDevice}}
        - {name: ts-state, emptyDir: {}}
        - name: identities
          projected:
            sources:
              - secret: {name: tatara-runner-identity-0, items: [{key: identity.edn, path: identity-0/identity.edn}]}
              - secret: {name: tatara-runner-identity-1, items: [{key: identity.edn, path: identity-1/identity.edn}]}
              - secret: {name: tatara-runner-identity-2, items: [{key: identity.edn, path: identity-2/identity.edn}]}

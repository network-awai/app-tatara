# Queue-based scaler for the runner StatefulSets (AWAI-3542, AWAI-3799).
# Reads the coordinator's GET /v1/queue (in-cluster Service, no tailscale) and sets each per-identity
# StatefulSet tatara-runner-N to 0 or 1 through the scale subresource (tatara.runner.scaler): up at once
# to the open replica jobs (max 3), down to 0 only after IDLE_SECONDS with no demand. An unreachable
# coordinator counts as no demand. Its service account can only get and patch statefulsets/scale of
# tatara-runner-0..2 and tatara-runner-apk-0. With TOOLCHAIN set (the APK lane, android/apk-scaler.yaml) the
# same boot scales only STATEFULSETS for runs that need that toolchain (AWAI-3834).
apiVersion: v1
kind: ServiceAccount
metadata: {name: tatara-scaler, namespace: tatara}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: tatara-scaler, namespace: tatara}
rules:
  - apiGroups: [apps]
    resources: [statefulsets/scale]
    resourceNames: [tatara-runner-0, tatara-runner-1, tatara-runner-2, tatara-runner-apk-0]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: tatara-scaler, namespace: tatara}
subjects: [{kind: ServiceAccount, name: tatara-scaler, namespace: tatara}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: tatara-scaler}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: tatara-scaler-boot, namespace: tatara}
data:
  boot.sh: |
    #!/bin/sh
    set -eu
    export DEBIAN_FRONTEND=noninteractive
    export http_proxy="$PROXY" https_proxy="$PROXY"
    apt-get -o Acquire::http::Proxy="$PROXY" update -q >/dev/null && apt-get -o Acquire::http::Proxy="$PROXY" install -y -q git curl ca-certificates >/dev/null
    T=$(mktemp -d); cd "$T"
    curl -fsSLo bb.tgz https://github.com/babashka/babashka/releases/download/v1.12.218/babashka-1.12.218-linux-amd64-static.tar.gz
    echo "7bd028cc794732ffde3da31ce4379840893c8e54f1046f92a8dfc4f4b3cddaf8  bb.tgz" | sha256sum -c - >/dev/null || { echo "digest mismatch: bb" >&2; exit 3; }
    tar -xzf bb.tgz -C /usr/local/bin bb
    git clone -q https://github.com/network-awai/app-tatara.git /opt/tatara && git -C /opt/tatara checkout -q --detach "$TATARA_REV"
    unset http_proxy https_proxy
    sts=${STATEFULSETS:-'"tatara-runner-0" "tatara-runner-1" "tatara-runner-2"'}
    tc=""; [ -n "${TOOLCHAIN:-}" ] && tc=":toolchain :$TOOLCHAIN"
    cat > /tmp/scaler.edn <<EOF
    {:coordinator "$COORDINATOR" :namespace "tatara"
     :statefulsets [$sts] $tc
     :min-replicas $MIN_REPLICAS :max-replicas $MAX_REPLICAS :idle-seconds $IDLE_SECONDS :poll-seconds 30}
    EOF
    until curl -s -m 5 -o /dev/null "$COORDINATOR/"; do echo "waiting for coordinator"; sleep 5; done
    cd /opt/tatara/packages/tatara-runner && exec bb scale /tmp/scaler.edn
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tatara-scaler, namespace: tatara}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: tatara-scaler}}
  template:
    metadata: {labels: {app: tatara-scaler}}
    spec:
      serviceAccountName: tatara-scaler
      hostUsers: false
      enableServiceLinks: false
      dnsPolicy: None
      dnsConfig: {nameservers: ["127.0.0.1"]}
      nodeSelector: {tatara.network/role: system}
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: scaler
          image: ubuntu:24.04
          command: ["/bin/sh", "/boot/boot.sh"]
          env:
            - {name: TATARA_REV, value: "TATARA_REV_PLACEHOLDER"}
            - {name: COORDINATOR, value: "http://10.96.79.90:8790"}
            - {name: PROXY, value: "http://10.96.79.128:3128"}
            # The API server by IP: the pod has no DNS.
            - {name: KUBERNETES_SERVICE_HOST, value: "10.96.0.1"}
            - {name: KUBERNETES_SERVICE_PORT, value: "443"}
            - {name: MIN_REPLICAS, value: "0"}
            - {name: MAX_REPLICAS, value: "3"}
            - {name: IDLE_SECONDS, value: "600"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER]}
          volumeMounts: [{name: boot, mountPath: /boot}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 512Mi}}
      volumes:
        - {name: boot, configMap: {name: tatara-scaler-boot}}
